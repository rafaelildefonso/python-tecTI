{% extends "base.html" %}

{% block titulo %}Cadastro{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-4">
          <i class="bi bi-person-plus"></i> Criar conta
        </h1>
        <form method="post">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome"
                   maxlength="100" required autofocus>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email"
                   maxlength="100" required>
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha"
                   minlength="4" required>
            <div class="form-text">Mínimo de 4 caracteres.</div>
          </div>
          <div class="mb-3">
            <label for="confirmacao" class="form-label">Confirmar senha</label>
            <input type="password" class="form-control" id="confirmacao" name="confirmacao"
                   minlength="4" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check-lg"></i> Cadastrar
          </button>
        </form>
        <p class="text-center mt-3 mb-0">
          <small>Já tem conta?</small>
          <a href="{{ url_for('login') }}">Entrar</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
