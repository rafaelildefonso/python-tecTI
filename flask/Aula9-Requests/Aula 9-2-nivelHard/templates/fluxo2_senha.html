{% extends "base.html" %}

{% block title %}Flow 2 — Password{% endblock %}
{% block header %}Digite a senha (fluxo 2){% endblock %}
{% block description %}<p>Senha de demonstração: <code>cotemig</code> — validação via API JSON</p>{% endblock %}

{% block content %}
<section class="card">
    <div id="msg-erro" class="alert alert-erro hidden"></div>

    <form id="form-senha-fluxo2">
        <label for="senha">Senha do portal</label>
        <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">

        <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="nav-links">
        <a class="btn btn-secondary" href="{{ url_for('fluxo2_inicio') }}">Voltar</a>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Início</a>
    </div>
</section>
{% endblock %}
